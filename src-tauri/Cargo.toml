[package]
name = "oliveira-edits"
version = "0.2.0"
description = "Editor local de vídeos e imagens em lote com perfis e FFmpeg"
authors = ["Oliveira Edits"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oliveira-edits"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-log", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-opener", "dep:tauri-plugin-notification", "dep:tauri-plugin-window-state"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fs2 = "0.4"
png = "0.17"
tauri = { version = "=2.11.3", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-notification = { version = "=2.4.0", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
