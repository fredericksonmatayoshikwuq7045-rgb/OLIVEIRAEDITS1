name: Validar e gerar instalador Windows
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run setup:ffmpeg -- --download-windows --target x86_64-pc-windows-msvc
      - run: npm test
      - run: npm run lint
      - run: npm run check:files
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: oliveira-edits-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
